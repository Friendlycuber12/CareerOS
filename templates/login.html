{% extends "base.html" %}

{% block extra_css %}
<link rel="stylesheet" href="/static/css/auth.css">
<link rel="stylesheet" href="/static/css/dashboard.css">
{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="card auth-card animate-fade-in-scale">
        <div class="auth-header">
            <a href="/" class="auth-logo">
                <i class="fas fa-layer-group"></i> CareerOS
            </a>
            <h1 class="auth-title">Welcome back</h1>
            <p class="auth-subtitle">Enter your details to access your workspace.</p>
        </div>

        <form action="/dashboard" method="GET" class="auth-form">
            <div class="input-group">
                <label class="input-label" for="email">Email address</label>
                <input type="email" id="email" class="input-field" placeholder="name@example.com" required>
            </div>

            <div class="input-group">
                <label class="input-label" for="password">Password</label>
                <div class="password-input-wrapper">
                    <input type="password" id="password" class="input-field w-full" placeholder="••••••••" required>
                    <button type="button" class="password-toggle"><i class="fas fa-eye"></i></button>
                </div>
            </div>

            <div class="auth-options">
                <label class="checkbox-label">
                    <input type="checkbox" style="accent-color:var(--primary);"> Remember me
                </label>
                <a href="/login" class="text-primary text-sm font-medium" data-action="password-reset">Forgot password?</a>
            </div>

            <button type="submit" class="btn btn-primary w-full mt-2">Sign in to account</button>
        </form>

        <div class="divider">Or continue with</div>

        <div class="social-login">
            <button type="button" class="btn btn-social" data-action="social-login" data-provider="GitHub"><i class="fab fa-github"></i> GitHub</button>
            <button type="button" class="btn btn-social" data-action="social-login" data-provider="Google"><i class="fab fa-google"></i> Google</button>
        </div>

        <div class="auth-footer">
            Don't have an account? <a href="/signup" class="text-primary font-medium">Sign up here</a>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="/static/js/auth.js?v=2"></script>
{% endblock %}
